apply plugin: 'com.android.application'

android {
    namespace = "com.mobiledaw.native"
    compileSdk = 35
    defaultConfig {
        // Separate applicationId: installs NEXT TO the web/Capacitor app
        // (com.mobiledaw.app), same precedent as app2 (com.mobiledaw.app2).
        applicationId "com.mobiledaw.native"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0-native-v1"
        // Redmi Note 9 is arm64; x86_64 kept for emulator testing.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { prefab true }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.google.oboe:oboe:1.9.3'
}
